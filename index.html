<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231c2b33'/%3E%3Crect x='5' y='11' width='22' height='10' rx='2' fill='%23b5532f'/%3E%3Crect x='5' y='11' width='22' height='3' fill='%23e2734f'/%3E%3C/svg%3E"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Beard Brothers — Construiește Școala</title>
    <meta
      name="description"
      content="Prinde cărămizile, ferește roaba de prejudecăți și ridică Școala Beard Brothers din Florești."
    />
    <meta name="theme-color" content="#A8DCF2" />
    <meta property="og:title" content="Beard Brothers — Construiește Școala" />
    <meta
      property="og:description"
      content="Prinde cărămizile, construiește Școala BB. Poți să mă întreci?"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:url" content="https://joaca.beard-brothers.ro/" />
    <meta property="og:image" content="https://joaca.beard-brothers.ro/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:image" content="https://joaca.beard-brothers.ro/og.png" />
    <!-- Fonts are self-hosted via @fontsource (imported in src/main.jsx) — no
         Google Fonts CDN request, GDPR-safe. -->

    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #a8dcf2;
      }
      body {
        font-family: "Nunito", system-ui, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      @keyframes bbPop {
        0% { transform: scale(0.82); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes bbFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }
      @keyframes bbRise {
        0% { transform: translateY(16px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
      :focus-visible {
        outline: 3px solid #1c2b33;
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
